spring:
  application:
    name: honor-power-query
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/honor_power?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:honor}
    password: ${DB_PASSWORD:honor123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: Asia/Shanghai

server:
  port: ${SERVER_PORT:8080}

app:
  demo-data-enabled: ${DEMO_DATA_ENABLED:false}
  live-provider:
    enabled: ${LIVE_PROVIDER_ENABLED:true}
    endpoint: ${LIVE_PROVIDER_ENDPOINT:https://api.wzryqz.cn/gethero}
    source-name: ${LIVE_PROVIDER_SOURCE_NAME:api.wzryqz.cn 第三方聚合数据}
